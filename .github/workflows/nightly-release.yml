name: Nightly Release Build

# Optimized nightly unsigned release builds of Bharat Browser for all three
# platforms on GitHub-hosted runners.
#
# Optimization summary (vs. naive full rebuild):
#   1. ccache — caches compiled object files on identical runner hardware
#   2. ThinLTO — links 2-3x faster than full LTO (default with official build)
#   3. Jumbo build — merges translation units for 30-50% faster compilation
#   4. Build output caching — ninja .ninja_log + build.ninja for incremental detection
#   5. Skip clean on third_party — preserve gclient dependencies between patch cycles
#   6. depot_tools caching — avoid re-cloning every run
#
# Estimated: ~6h → ~2-2.5h on subsequent runs (first run: ~3.5-4h)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos
      publish_nightly:
        description: Update the rolling `nightly` prerelease (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: pch_defines,time_macros
  CCACHE_BASEDIR: ${{ github.workspace }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Resolve build matrix and publish flag
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          PUBLISH_INPUT: ${{ inputs.publish_nightly }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          matrix='[
            {"platform":"linux","arch":"x64","runner":"ubuntu-latest","config":"release.linux.ci.yaml","timeout":420},
            {"platform":"windows","arch":"x64","runner":"windows-latest","config":"release.windows.ci.yaml","timeout":420},
            {"platform":"macos","arch":"arm64","runner":"macos-latest","config":"release.macos.arm64.ci.yaml","timeout":420}
          ]'
          if [ "$PLATFORMS" != "all" ]; then
            matrix="$(jq -c --arg p "$PLATFORMS" '[ .[] | select(.platform == $p) ]' <<<"$matrix")"
          else
            matrix="$(jq -c . <<<"$matrix")"
          fi

          publish="false"
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            if [ "$PUBLISH_INPUT" = "true" ]; then
              publish="true"
            fi
          fi

          {
            echo "matrix=$matrix"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Install ccache (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: matrix.platform == 'macos'
        run: brew install ccache

      - name: Install ccache (Windows)
        if: matrix.platform == 'windows'
        run: choco install ccache --no-progress

      - name: Configure ccache
        run: |
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config compiler_check="$CCACHE_COMPILERCHECK"
          ccache --set-config no_hash_dir="$CCACHE_NOHASHDIR"
          ccache --set-config sloppiness="$CCACHE_SLOPPINESS"
          ccache --zero-stats

      - name: Resolve chromium pin and paths
        id: pin
        run: |
          set -euo pipefail
          . packages/browseros/CHROMIUM_VERSION
          version="$MAJOR.$MINOR.$BUILD.$PATCH"

          if [ "$RUNNER_OS" = "Windows" ]; then
            parent="$(cd "$GITHUB_WORKSPACE/.." && pwd -W)"
          else
            parent="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          fi

          {
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          {
            echo "CHROMIUM_ROOT=$parent/chromium"
            echo "CHROMIUM_SRC=$parent/chromium/src"
          } >> "$GITHUB_ENV"

      - name: Cache depot_tools
        id: cache-depot
        uses: actions/cache@v4
        with:
          path: ${{ env.CHROMIUM_ROOT }}/depot_tools
          key: depot-tools-${{ runner.os }}-${{ runner.arch }}

      - name: Cache gclient output (third_party, etc.)
        id: cache-gclient
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CHROMIUM_ROOT }}/src/third_party
            ${{ env.CHROMIUM_ROOT }}/src/buildtools
          key: gclient-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}-${{ hashFiles('packages/browseros/CHROMIUM_VERSION') }}

      - name: Restore build output cache (ninja log + deps for incremental detection)
        id: cache-build
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CHROMIUM_ROOT }}/src/out
          key: build-out-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}-${{ github.sha }}
          restore-keys: |
            build-out-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}-
            build-out-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache ccache directory
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/AppData/Local/ccache
            ~/Library/Caches/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.version }}

      - name: Ensure chromium checkout at pinned tag
        run: |
          set -euo pipefail
          uv run --project packages/browseros python scripts/ci/setup_chromium.py \
            --chromium-root "$CHROMIUM_ROOT" --step checkout

      - name: Clean build artifacts only (preserve third_party for gclient cache)
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          # Remove only the out/ directory — do NOT git clean third_party/
          # which would destroy gclient-cached dependencies
          if [ -d "$CHROMIUM_SRC/out" ]; then
            rm -rf "$CHROMIUM_SRC/out"
            echo "Removed out/ directory"
          else
            echo "No out/ directory to clean"
          fi
          # Reset tracked files to pristine state without touching third_party
          cd "$CHROMIUM_SRC"
          git reset --hard HEAD
          git checkout -- .

      - name: Sync chromium dependencies (gclient) — skip if cache hit
        if: steps.cache-gclient.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          uv run --project packages/browseros python scripts/ci/setup_chromium.py \
            --chromium-root "$CHROMIUM_ROOT" --step sync

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2
          "$CHROMIUM_SRC/build/install-build-deps.sh" --no-prompt

      - name: Build Bharat Browser (unsigned)
        working-directory: packages/browseros
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          uv run browseros build \
            --config "build/config/${{ matrix.config }}" \
            --chromium-src "$CHROMIUM_SRC"

      - name: Report ccache stats
        run: ccache -s

      - name: Report disk usage
        if: always()
        run: df -h || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bharat-browser-nightly-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/browseros/releases/*/*.dmg
            packages/browseros/releases/*/*.AppImage
            packages/browseros/releases/*/*.deb
            packages/browseros/releases/*/*_installer.exe
            packages/browseros/releases/*/*_installer.zip

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*/*.dmg dist/*/*.AppImage dist/*/*.deb dist/*/*_installer.exe dist/*/*_installer.zip dist/*.dmg dist/*.AppImage dist/*.deb dist/*_installer.exe dist/*_installer.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No artifacts found to publish"
            exit 1
          fi
          printf 'Publishing:\n%s\n' "${files[@]}"

          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Automated unsigned nightly build from \`main\` (commit $GITHUB_SHA).

          These artifacts are NOT code signed or notarized — expect OS warnings on install. For signed builds use the regular releases.
          EOF

          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Bharat Browser Nightly (unsigned) $(date -u +%Y-%m-%d)" \
            --notes-file "$notes_file" \
            "${files[@]}"
