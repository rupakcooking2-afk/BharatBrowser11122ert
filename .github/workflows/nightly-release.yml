name: Publish Nightly Release

# Publishes artifacts produced by the Build Bharat Browser (Resumable)
# workflow as a GitHub nightly prerelease.
#
# Triggered when the build workflow completes — no compilation happens here.

on:
  workflow_run:
    workflows: ["Build Bharat Browser (Resumable)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update rolling nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Collect all installer artifacts
          files=()
          for ext in dmg AppImage deb exe zip; do
            while IFS= read -r -d '' f; do files+=("$f"); done < <(find dist -name "*.$ext" -print0 2>/dev/null || true)
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::No artifacts found to publish — build may still be in progress"
            exit 0
          fi

          printf 'Publishing %d artifacts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"

          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          Automated nightly build from \`main\` (commit $GITHUB_SHA).

          These artifacts are NOT code signed or notarized — expect OS warnings on install.
          For signed builds use the regular releases.
          EOF

          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Bharat Browser Nightly (unsigned) $(date -u +%Y-%m-%d)" \
            --notes-file "$notes_file" \
            "${files[@]}"
